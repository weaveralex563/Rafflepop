kind = "web"
previewPath = "/"
title = "RafflePop"
version = "1.0.0"
id = "artifacts/rafflepop"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25477

[services.development]
run = "pnpm --filter @workspace/rafflepop run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rafflepop", "run", "build" ]
publicDir = "artifacts/rafflepop/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25477"
BASE_PATH = "/"
